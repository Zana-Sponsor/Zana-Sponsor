<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProxoLink Admin v9.2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'Rabar_021';src:url('https://raw.githubusercontent.com/Zana-Sponsor/Zana-Sponsor/main/Rabar_021.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080b18;--card:#0f1225;--card2:#131629;--border:rgba(255,255,255,0.07);--purple:#c855e0;--pdim:rgba(200,85,224,0.1);--red:#ef4444;--green:#22c55e;--yellow:#f59e0b;--text:#e2e8f0;--muted:#64748b;}
body{font-family:'Rabar_021',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(200,85,224,0.15),transparent 60%);}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px 28px;display:flex;flex-direction:column;gap:18px;}
.shield{width:56px;height:56px;border-radius:16px;background:var(--pdim);border:1px solid rgba(200,85,224,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:22px;}
.login-title{text-align:center;font-size:20px;color:var(--purple);font-weight:900;}
.login-sub{text-align:center;font-size:12px;color:var(--muted);}
.inp{width:100%;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Rabar_021',sans-serif;font-size:13px;outline:none;direction:ltr;text-align:left;}
.inp:focus{border-color:var(--purple);}
.inp::placeholder{color:#374151;}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#7b2fd4,var(--purple));color:#fff;border:none;border-radius:13px;font-family:'Rabar_021',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.login-btn:hover{opacity:0.9;}
.login-err{font-size:12px;color:var(--red);text-align:center;padding:10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;display:none;}

/* ADMIN */
.admin-wrap{display:none;flex-direction:column;min-height:100vh;}
.topbar{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar-l h1{font-size:15px;color:var(--purple);font-weight:800;}
.ver{font-size:10px;color:var(--purple);background:var(--pdim);border:1px solid rgba(200,85,224,0.2);padding:2px 9px;border-radius:20px;}
.topbar-r{display:flex;gap:8px;}
.tb-btn{padding:8px 14px;border-radius:10px;font-family:'Rabar_021',sans-serif;font-size:12px;cursor:pointer;border:none;display:flex;align-items:center;gap:5px;}
.tb-r{background:var(--pdim);color:var(--purple);border:1px solid rgba(200,85,224,0.2);}
.tb-l{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}

.main{padding:20px 16px 60px;max-width:960px;margin:0 auto;width:100%;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
.sbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.sico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.ip{background:var(--pdim);color:var(--purple);}
.ig{background:rgba(34,197,94,0.1);color:var(--green);}
.ir{background:rgba(239,68,68,0.1);color:var(--red);}
.iy{background:rgba(245,158,11,0.1);color:var(--yellow);}
.snum{font-size:22px;font-weight:800;color:#fff;}
.slbl{font-size:10.5px;color:var(--muted);text-align:center;}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:14px;}
.sinp{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:11px;color:var(--text);font-family:'Rabar_021',sans-serif;font-size:12.5px;outline:none;direction:rtl;}
.sinp:focus{border-color:var(--purple);}
.sinp::placeholder{color:#374151;}

/* TABLE */
.tcard{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;}
.tscroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:700px;}
thead tr{background:rgba(200,85,224,0.06);border-bottom:1px solid var(--border);}
thead th{padding:12px 14px;font-size:10.5px;color:var(--purple);font-weight:700;text-align:right;white-space:nowrap;}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
tbody td{padding:11px 14px;font-size:12px;color:#94a3b8;vertical-align:middle;}

.ucell{display:flex;align-items:center;gap:9px;}
.avt{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5b1fa8,var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.uname{font-size:12.5px;color:#fff;font-weight:600;}
.uid{font-size:9px;color:#374151;direction:ltr;text-align:left;font-family:monospace;}
.eml{direction:ltr;text-align:right;color:#64748b;font-size:11.5px;}
.dtxt{font-size:10.5px;color:#475569;line-height:1.6;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;}
.b-act{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:var(--green);}
.b-ban{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:var(--red);}

.pwrap{display:flex;align-items:center;gap:5px;direction:ltr;}
.ptxt{font-family:monospace;font-size:11px;color:#64748b;letter-spacing:2px;}
.peye{background:none;border:none;color:#64748b;cursor:pointer;font-size:11px;padding:2px 5px;border-radius:5px;}
.peye:hover{color:#fff;background:rgba(255,255,255,0.06);}

.arow{display:flex;gap:5px;}
.abtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:none;}
.a-ban{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.15);}
.a-ban:hover{background:rgba(239,68,68,0.25);}
.a-unban{background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.15);}
.a-unban:hover{background:rgba(34,197,94,0.25);}
.a-del{background:rgba(239,68,68,0.06);color:#7f1d1d;border:1px solid rgba(239,68,68,0.1);}
.a-del:hover{background:rgba(239,68,68,0.2);color:var(--red);}

.tfooter{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}

/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:9998;}
.moverlay.on{display:flex;}
.mbox{width:88%;max-width:300px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:28px 22px;text-align:center;}
.mbox h3{font-size:16px;color:#fff;margin-bottom:10px;}
.mbox p{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:22px;white-space:pre-line;}
.mbtns{display:flex;gap:8px;}
.mcancel{flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);font-family:'Rabar_021',sans-serif;font-size:13px;cursor:pointer;}
.mok{flex:1;padding:12px;border-radius:12px;border:none;color:#fff;font-family:'Rabar_021',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-size:13px;display:none;z-index:9999;white-space:nowrap;}
.tok{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:var(--green);}
.terr{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:var(--red);}
.emsg{text-align:center;padding:40px;color:var(--muted);}
.lmsg{text-align:center;padding:30px;color:var(--muted);}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="shield">🛡️</div>
    <div class="login-title">ProxoLink Admin</div>
    <div class="login-sub">تەنها بۆ بەڕێوەبەران — v9.2</div>
    <input class="inp" type="password" id="adminPass" placeholder="پاسۆردی ئەدمین..."
      onkeydown="if(event.key==='Enter')checkAdmin()">
    <div class="login-err" id="loginErr">پاسۆردەکە هەڵەیە</div>
    <button class="login-btn" onclick="checkAdmin()">
      <i class="fas fa-sign-in-alt"></i> چوونەژوورەوە
    </button>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="adminWrap">
  <div class="topbar">
    <div class="topbar-l">
      <h1>🛡️ ProxoLink Admin</h1>
      <span class="ver">v9.2</span>
      <span style="font-size:11px;color:var(--muted)" id="lastRef"></span>
    </div>
    <div class="topbar-r">
      <button class="tb-btn tb-r" onclick="loadUsers()">
        <i class="fas fa-sync-alt" id="refIco"></i> نوێکردنەوە
      </button>
      <button class="tb-btn tb-l" onclick="adminLogout()">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="sbox"><div class="sico ip"><i class="fas fa-users"></i></div><div class="snum" id="sT">—</div><div class="slbl">کۆی بەکارهێنەر</div></div>
      <div class="sbox"><div class="sico ig"><i class="fas fa-user-check"></i></div><div class="snum" id="sA">—</div><div class="slbl">چالاک</div></div>
      <div class="sbox"><div class="sico ir"><i class="fas fa-user-slash"></i></div><div class="snum" id="sB">—</div><div class="slbl">بانکراو</div></div>
      <div class="sbox"><div class="sico iy"><i class="fas fa-calendar-day"></i></div><div class="snum" id="sTd">—</div><div class="slbl">ئەمڕۆ</div></div>
    </div>

    <div class="toolbar">
      <input class="sinp" id="sinp" placeholder="🔍 گەڕان بە ناو یان ئیمەیل..." oninput="filterUsers()">
    </div>

    <div class="tcard">
      <div class="tscroll">
        <table>
          <thead>
            <tr>
              <th>#</th><th>بەکارهێنەر</th><th>ئیمەیل</th>
              <th>پاسۆرد</th><th>کاتی تۆمارکردن</th><th>دۆخ</th><th>کردار</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="lmsg"><i class="fas fa-circle-notch fa-spin"></i> بارکردن...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="tfooter">
        <span id="fcnt">—</span>
        <span id="ftime"></span>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="moverlay" id="moverlay">
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <p id="mbody"></p>
    <div class="mbtns">
      <button class="mcancel" onclick="closeModal()">نەخێر</button>
      <button class="mok" id="mokbtn" onclick="doAction()">بەڵێ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PASS   = 'proxo@admin2025';
const SB_URL = 'https://rtbsblgaewmfiynhwgkv.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0YnNibGdhZXdtZml5bmh3Z2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODIwNDcsImV4cCI6MjA4Njk1ODA0N30.-aEC48G8Hltu6N8y2nPhAYPdB-4PSsR78OSXSLMAGcU';

let sb, allUsers = [], usersMap = {}, pending = null;

window.addEventListener('load', () => {
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  if (sessionStorage.getItem('pa') === '1') showAdmin();
});

function checkAdmin() {
  if (document.getElementById('adminPass').value === PASS) {
    sessionStorage.setItem('pa', '1');
    document.getElementById('loginErr').style.display = 'none';
    showAdmin();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('adminPass').value = '';
  }
}

function showAdmin() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminWrap').style.display = 'flex';
  loadUsers();
}

function adminLogout() {
  sessionStorage.removeItem('pa');
  document.getElementById('adminWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminPass').value = '';
}

async function loadUsers() {
  document.getElementById('refIco').className = 'fas fa-circle-notch fa-spin';
  const { data, error } = await sb
    .from('profiles')
    .select('id, full_name, email, created_at, banned_until, plain_password')
    .order('created_at', { ascending: false });
  document.getElementById('refIco').className = 'fas fa-sync-alt';
  if (error) { showToast('❌ ' + error.message, 'terr'); return; }
  allUsers = data || [];
  renderTable(allUsers);
  updateStats(allUsers);
  const now = new Date();
  document.getElementById('lastRef').textContent =
    now.toLocaleTimeString('ku', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('ftime').textContent =
    now.toLocaleTimeString('ku', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function updateStats(u) {
  const now = new Date();
  const ban = u.filter(x => x.banned_until && new Date(x.banned_until) > now);
  const tod = u.filter(x => new Date(x.created_at).toDateString() === now.toDateString());
  document.getElementById('sT').textContent  = u.length;
  document.getElementById('sA').textContent  = u.length - ban.length;
  document.getElementById('sB').textContent  = ban.length;
  document.getElementById('sTd').textContent = tod.length;
}

function filterUsers() {
  const q = document.getElementById('sinp').value.toLowerCase();
  renderTable(q ? allUsers.filter(u =>
    (u.full_name||'').toLowerCase().includes(q) ||
    (u.email||'').toLowerCase().includes(q)
  ) : allUsers);
}

function renderTable(users) {
  usersMap = {};
  users.forEach(u => usersMap[u.id] = u);
  const body = document.getElementById('tbody');
  document.getElementById('fcnt').textContent = users.length + ' بەکارهێنەر';

  if (!users.length) {
    body.innerHTML = '<tr><td colspan="7" class="emsg"><i class="fas fa-users-slash" style="font-size:22px;display:block;margin-bottom:8px"></i>هیچ بەکارهێنەرێک نەدۆزرایەوە</td></tr>';
    return;
  }

  const now = new Date();
  body.innerHTML = users.map((u, i) => {
    const name    = u.full_name || '—';
    const init    = (u.full_name || u.email || '?')[0].toUpperCase();
    const banned  = u.banned_until && new Date(u.banned_until) > now;
    const sid     = u.id.substring(0,8) + '…';
    const dStr    = u.created_at
      ? new Date(u.created_at).toLocaleDateString('ku',{year:'numeric',month:'short',day:'numeric'})
        + '<br>' + new Date(u.created_at).toLocaleTimeString('ku',{hour:'2-digit',minute:'2-digit'})
      : '—';

    const badge = banned
      ? '<span class="badge b-ban"><i class="fas fa-ban" style="font-size:8px"></i> بانکراو</span>'
      : '<span class="badge b-act"><i class="fas fa-circle" style="font-size:7px"></i> چالاک</span>';

    const banBtn = banned
      ? `<button class="abtn a-unban" data-id="${u.id}" data-act="unban"><i class="fas fa-user-check"></i></button>`
      : `<button class="abtn a-ban"   data-id="${u.id}" data-act="ban"><i class="fas fa-ban"></i></button>`;

    // پاسۆرد — encode کردن بۆ ئەوەی هیچ کاراکتەرێک کێشەی نەدات
    const pwEncoded = u.plain_password ? btoa(unescape(encodeURIComponent(u.plain_password))) : '';
    const pwCell = u.plain_password
      ? `<div class="pwrap">
           <span class="ptxt" id="pt${i}">••••••••</span>
           <button class="peye" data-idx="${i}" data-pw="${pwEncoded}">
             <i class="fas fa-eye" id="pe${i}"></i>
           </button>
         </div>`
      : '<span style="color:#374151;font-size:11px">—</span>';

    return `<tr>
      <td style="color:#374151;font-size:11px">${i+1}</td>
      <td><div class="ucell"><div class="avt">${init}</div><div><div class="uname">${name}</div><div class="uid">${sid}</div></div></div></td>
      <td><span class="eml">${u.email||'—'}</span></td>
      <td>${pwCell}</td>
      <td><div class="dtxt">${dStr}</div></td>
      <td>${badge}</td>
      <td><div class="arow">
        ${banBtn}
        <button class="abtn a-del" data-id="${u.id}" data-act="delete"><i class="fas fa-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('');

  // Event delegation
  body.onclick = function(e) {
    // پاسۆرد toggle
    const eyeBtn = e.target.closest('[data-idx]');
    if (eyeBtn) {
      const idx = eyeBtn.dataset.idx;
      const pw  = decodeURIComponent(escape(atob(eyeBtn.dataset.pw)));
      const txt = document.getElementById('pt' + idx);
      const ico = document.getElementById('pe' + idx);
      if (txt.textContent === '••••••••') {
        txt.textContent = pw;
        txt.style.color = '#e2e8f0';
        txt.style.letterSpacing = 'normal';
        ico.className = 'fas fa-eye-slash';
      } else {
        txt.textContent = '••••••••';
        txt.style.color = '#64748b';
        txt.style.letterSpacing = '2px';
        ico.className = 'fas fa-eye';
      }
      return;
    }
    // کردارەکان
    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      const id  = actBtn.dataset.id;
      const act = actBtn.dataset.act;
      const u   = usersMap[id];
      if (u) openModal(act, id, u.email);
    }
  };
}

function openModal(act, id, email) {
  pending = { act, id, email };
  const cfg = {
    ban:    { title:'🚫 بانکردن',       body:`دڵنیایت لە بانکردنی؟\n${email}`,        color:'#ef4444', btn:'بانبکە' },
    unban:  { title:'✅ بانەکە بکەرەوە', body:`دڵنیایت لە کردنەوەی بانی؟\n${email}`, color:'#22c55e', btn:'بانەکە بکەرەوە' },
    delete: { title:'🗑️ سڕینەوە',       body:`گەڕانەوەی نییە!\n${email}`,             color:'#ef4444', btn:'بسڕەوە' },
  };
  const c = cfg[act];
  document.getElementById('mtitle').textContent = c.title;
  document.getElementById('mbody').textContent  = c.body;
  document.getElementById('mokbtn').style.background = c.color;
  document.getElementById('mokbtn').textContent = c.btn;
  document.getElementById('moverlay').classList.add('on');
}

function closeModal() {
  document.getElementById('moverlay').classList.remove('on');
  pending = null;
}

async function doAction() {
  if (!pending) return;
  closeModal();
  const { act, id, email } = pending;

  if (act === 'ban') {
    const d = new Date(); d.setFullYear(d.getFullYear() + 10);
    const { error } = await sb.from('profiles').update({ banned_until: d.toISOString() }).eq('id', id);
    if (error) { showToast('❌ ' + error.message, 'terr'); return; }
    const u = allUsers.find(x => x.id === id);
    if (u) u.banned_until = d.toISOString();
    showToast('✅ بانکراو: ' + email, 'tok');

  } else if (act === 'unban') {
    const { error } = await sb.from('profiles').update({ banned_until: null }).eq('id', id);
    if (error) { showToast('❌ ' + error.message, 'terr'); return; }
    const u = allUsers.find(x => x.id === id);
    if (u) u.banned_until = null;
    showToast('✅ بانەکە کرایەوە: ' + email, 'tok');

  } else if (act === 'delete') {
    const { error } = await sb.from('profiles').delete().eq('id', id);
    if (error) { showToast('❌ ' + error.message, 'terr'); return; }
    allUsers = allUsers.filter(x => x.id !== id);
    showToast('🗑️ سڕایەوە: ' + email, 'tok');
  }

  renderTable(allUsers);
  updateStats(allUsers);
}

function showToast(msg, cls) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + cls;
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
