<title>K4k Hussen | خزمەتگوزاری و پەیوەندی</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@font-face{font-family:'R';src:url('https://raw.githubusercontent.com/Zana-Sponsor/Zana-Sponsor/main/Rabar_021.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'R',sans-serif;background:#eef0f5;min-height:100vh;display:flex;justify-content:center;}
.wrap{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.hdr{height:118px;background:linear-gradient(120deg,#5b1fa8,#8a2be2 55%,#c855e0);position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.16),transparent 45%),radial-gradient(circle at 10% 85%,rgba(255,255,255,.12),transparent 40%);}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:22px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0;}
.av-wrap{display:flex;justify-content:center;margin-top:-48px;margin-bottom:12px;position:relative;z-index:2;}
.av{width:88px;height:88px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#5b1fa8,#c855e0);box-shadow:0 6px 20px rgba(91,31,168,.3);}
.av-in{width:100%;height:100%;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#5b1fa8;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;}
.av img{width:100%;height:100%;object-fit:cover;display:block;}
.profile{padding:0 22px;text-align:center;margin-bottom:24px;}
.uname{font-size:19px;font-weight:700;color:#111;margin-bottom:5px;}
.ubio{font-size:14px;color:#777;line-height:1.9;white-space:pre-line;}
.vbanner-wrap{padding:0 22px;margin-bottom:24px;}
.vbanner{position:relative;display:flex;align-items:center;gap:13px;width:100%;background:#fff;border-radius:18px;padding:11px 13px 11px 11px;text-decoration:none;box-shadow:0 1px 3px rgba(17,10,30,.06),0 12px 26px -10px rgba(17,10,30,.2);border:1px solid #f0eef7;border-right:3px solid #c855e0;}
.vbanner:active{transform:scale(.98);}
.vbanner-thumb{position:relative;flex-shrink:0;width:70px;height:94px;border-radius:13px;overflow:hidden;background:#111;}
.vbanner-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.vbanner-text{flex:1;min-width:0;text-align:right;display:flex;flex-direction:column;justify-content:flex-start;padding:2px 0;}
.vbanner-title{color:#111;font-size:14px;font-weight:800;margin-bottom:4px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vbanner-sub{color:#8a8792;font-size:11.5px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.vbanner-chev{flex-shrink:0;color:#c6c2d1;font-size:12px;align-self:center;}
.btns{padding:0 22px;display:flex;flex-direction:column;gap:12px;}
.pl-btn{display:flex;align-items:center;width:100%;padding:15px 14px;border-radius:50px;color:#fff;text-decoration:none;cursor:pointer;transition:transform .18s ease,opacity .18s ease;position:relative;overflow:hidden;}
.pl-btn:active{transform:scale(.97);opacity:.92;}
.pl-btn::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.2);opacity:0;transition:opacity .32s ease-out;pointer-events:none;}
.pl-btn.pressed::before{opacity:1;transition:opacity .06s ease-in;}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rippleAnim .6s ease-out forwards;pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(1);opacity:0;}}
.pl-lbl{flex:1;text-align:center;font-size:17px;font-weight:700;}
.tt-wrap{display:flex;justify-content:center;margin:14px 22px 0;}
.tt-sm{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:50px;background:#111;color:#fff;text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 5px 16px rgba(0,0,0,.3);}
.tt-sm:active{transform:scale(.97);}
.footer{width:100%;margin-top:auto;padding:60px 20px 24px;text-align:center;}
.footer small{display:block;font-size:11px;color:#bbb;margin-bottom:6px;font-weight:600;}
.footer img{height:15px;display:block;margin:0 auto 10px;opacity:.75;}
.legal{font-size:10px;color:#bbb;}.legal a{color:inherit;text-decoration:none;margin:0 5px;}
@keyframes sh{0%{left:-100%}100%{left:160%}}
.shine-active::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(to right,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:sh 2.4s ease-in-out infinite;pointer-events:none;}
.no-sh::after{animation:none!important;display:none;}
