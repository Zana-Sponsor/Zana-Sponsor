<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Proxo Ads — تۆمارکردن</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'R';src:url('https://raw.githubusercontent.com/Zana-Sponsor/Zana-Sponsor/main/Rabar_021.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --bg:#0d1117;
  --card:rgba(255,255,255,0.05);
  --card-border:rgba(255,255,255,0.10);
  --glass:rgba(255,255,255,0.07);
  --glass-hover:rgba(255,255,255,0.10);
  --input-bg:rgba(255,255,255,0.06);
  --input-border:rgba(255,255,255,0.12);
  --input-focus:rgba(255,255,255,0.25);
  --text:#f0f2f5;
  --text-sub:rgba(240,242,245,0.55);
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --gr:#22c55e;
  --rd:#ef4444;
  --yw:#f59e0b;
  --btn-shadow:0 8px 32px rgba(99,102,241,0.35);
  --glow:0 0 60px rgba(99,102,241,0.15);
}

html,body{
  font-family:'R',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(99,102,241,0.05) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* ══ LAYOUT ══ */
#wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 20px;
  position:relative;
  z-index:1;
}

.inner{
  width:100%;
  max-width:400px;
  animation:fadeUp .4s ease both;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

/* ══ BRAND ══ */
.brand{text-align:center;margin-bottom:36px;}

.brand-logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:64px;height:64px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 32px rgba(99,102,241,0.45);
  margin:0 auto 18px;
  font-size:28px;
  color:#fff;
}

.brand h1{
  font-family:'Inter',sans-serif;
  font-size:28px;
  font-weight:900;
  color:var(--text);
  letter-spacing:-1px;
}
.brand h1 span{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.brand p{
  font-size:13px;
  color:var(--text-sub);
  margin-top:7px;
  line-height:1.6;
}

/* ══ CARD ══ */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:24px;
  padding:28px 24px 32px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--glow), 0 2px 40px rgba(0,0,0,0.4);
}

/* ══ TABS ══ */
.tabs{
  display:flex;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--card-border);
  border-radius:14px;
  padding:4px;
  margin-bottom:24px;
  gap:4px;
}
.tab{
  flex:1;
  padding:10px 8px;
  text-align:center;
  font-size:13.5px;
  font-family:'R',sans-serif;
  border-radius:11px;
  cursor:pointer;
  border:none;
  background:transparent;
  color:var(--text-sub);
  transition:all .2s;
  font-weight:600;
}
.tab.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-weight:800;
  box-shadow:0 3px 12px rgba(99,102,241,0.4);
}

/* ══ INPUTS ══ */
.finp{
  width:100%;
  padding:15px 18px;
  background:var(--input-bg);
  border:1.5px solid var(--input-border);
  border-radius:14px;
  color:var(--text);
  font-family:'R',sans-serif;
  font-size:15px;
  outline:none;
  transition:all .2s;
  margin-bottom:12px;
  -webkit-appearance:none;
}
.finp:focus{
  border-color:var(--accent);
  background:rgba(99,102,241,0.08);
  box-shadow:0 0 0 3px rgba(99,102,241,0.15);
}
.finp::placeholder{color:var(--text-sub);}
.finp[dir=ltr]{text-align:left;}

/* ══ BUTTON ══ */
.btn{
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:none;
  border-radius:15px;
  font-family:'R',sans-serif;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  box-shadow:var(--btn-shadow);
  transition:all .2s;
  margin-top:4px;
  letter-spacing:.2px;
}
.btn:active{opacity:.88;transform:scale(.99);}
.btn:disabled{opacity:.4;pointer-events:none;cursor:not-allowed;}
.btn .spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ══ MSG ══ */
.msg{
  font-size:12.5px;
  text-align:center;
  padding:12px 16px;
  border-radius:12px;
  display:none;
  margin-top:12px;
  line-height:1.6;
  font-weight:600;
}
.msg.ok{
  background:rgba(34,197,94,0.10);
  border:1px solid rgba(34,197,94,0.25);
  color:var(--gr);
}
.msg.err{
  background:rgba(239,68,68,0.10);
  border:1px solid rgba(239,68,68,0.25);
  color:var(--rd);
}

/* ══ DIVIDER ══ */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:18px 0 16px;
  color:var(--text-sub);
  font-size:11px;
}
.divider::before,.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--card-border);
}

/* ══ FOOTER NOTE ══ */
.footer-note{
  text-align:center;
  margin-top:20px;
  font-size:11.5px;
  color:var(--text-sub);
  line-height:1.8;
}
.footer-note a{color:var(--accent);text-decoration:none;font-weight:700;}

/* ══ FLOATING ORBS (decorative) ══ */
.orb{
  position:fixed;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
  z-index:0;
  opacity:.35;
}
.orb1{width:300px;height:300px;background:var(--accent);top:-80px;right:-80px;animation:float1 8s ease-in-out infinite;}
.orb2{width:250px;height:250px;background:var(--accent2);bottom:-60px;left:-60px;animation:float2 10s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(-20px,20px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-15px);}}

/* ══ INPUT LABEL ══ */
.lbl{
  font-size:11.5px;
  color:var(--text-sub);
  display:block;
  margin-bottom:6px;
  font-weight:700;
  letter-spacing:.3px;
}

/* ══ NAME WRAP ══ */
#nameWrap{display:none;}

/* ══ SPINNER OVERLAY ══ */
#loadingOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
}
#loadingOverlay.show{display:flex;}
.loading-ring{
  width:48px;height:48px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
.loading-txt{font-size:13px;color:var(--text-sub);font-family:'R',sans-serif;}
</style>
</head>
<body>

<!-- Decorative orbs -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Loading overlay -->
<div id="loadingOverlay">
  <div class="loading-ring"></div>
  <div class="loading-txt">چوارچێوەکردن...</div>
</div>

<div id="wrap">
  <div class="inner">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">
        <i class="fas fa-rectangle-ad"></i>
      </div>
      <h1>Proxo <span>Ads</span></h1>
      <p>بەڕێوەبردنی ڕیکلامەکانی تیکتۆک</p>
    </div>

    <!-- Card -->
    <div class="card">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab on" id="tabL" onclick="switchTab('login')">چوونەژوورەوە</button>
        <button class="tab" id="tabS" onclick="switchTab('signup')">تۆمارکردن</button>
      </div>

      <!-- Name (signup only) -->
      <div id="nameWrap">
        <span class="lbl">ناوی تەواو</span>
        <input class="finp" type="text" id="authName" placeholder="ناوت بنووسە" autocomplete="name">
      </div>

      <!-- Email -->
      <span class="lbl">ئیمەیل</span>
      <input class="finp" type="email" id="authEmail" placeholder="you@example.com" dir="ltr" autocomplete="email">

      <!-- Password -->
      <span class="lbl" id="passLbl">پاسۆرد</span>
      <input class="finp" type="password" id="authPass" placeholder="••••••••" dir="ltr" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doAuth()">

      <!-- Submit button -->
      <button class="btn" id="authBtn" onclick="doAuth()">
        <i class="fas fa-arrow-left"></i>
        <span id="authBtnTxt">چوونەژوورەوە</span>
      </button>

      <!-- Message -->
      <div class="msg" id="authMsg"></div>

    </div>

    <!-- Footer -->
    <div class="footer-note">
      پرسیارت هەیە؟ <a href="https://wa.me/9647501234567" target="_blank">پەیوەندی بکە</a>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  SUPABASE CONFIG
// ═══════════════════════════════════════════════
const SB_URL = 'https://cojchkwssmasiejcgvbk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvamNoa3dzc21hc2llamNndmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTE1MTIsImV4cCI6MjA5Mjg4NzUxMn0.RCALy3wpKHGAkmXWcBqEb_QFEUmh6ErdRbfrBmagvtw';

const sb = supabase.createClient(SB_URL, SB_KEY);

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let aMode = 'login';

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function showMsg(txt, type) {
  const el = document.getElementById('authMsg');
  el.textContent = txt;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

function hideMsg() {
  document.getElementById('authMsg').style.display = 'none';
}

function setLoading(on, text) {
  const overlay = document.getElementById('loadingOverlay');
  if (on) {
    overlay.querySelector('.loading-txt').textContent = text || 'چوارچێوەکردن...';
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
  }
}

function setBtnLoading(on, text) {
  const btn = document.getElementById('authBtn');
  const txt = document.getElementById('authBtnTxt');
  btn.disabled = on;
  if (on) {
    txt.textContent = text || 'چوارچێوەکردن...';
    btn.querySelector('i').className = 'fas fa-circle-notch spin';
  } else {
    btn.querySelector('i').className = 'fas fa-arrow-left';
    txt.textContent = aMode === 'login' ? 'چوونەژوورەوە' : 'تۆمارکردن';
  }
}

function generateOTP() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

// ═══════════════════════════════════════════════
//  TAB SWITCH
// ═══════════════════════════════════════════════
function switchTab(m) {
  aMode = m;
  document.getElementById('tabL').classList.toggle('on', m === 'login');
  document.getElementById('tabS').classList.toggle('on', m === 'signup');
  document.getElementById('nameWrap').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('authBtnTxt').textContent = m === 'login' ? 'چوونەژوورەوە' : 'تۆمارکردن';
  document.getElementById('passLbl').textContent = m === 'login' ? 'پاسۆرد' : 'پاسۆردی نوێ';
  document.getElementById('authPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  hideMsg();
}

// ═══════════════════════════════════════════════
//  MAIN AUTH HANDLER
// ═══════════════════════════════════════════════
async function doAuth() {
  const email    = document.getElementById('authEmail').value.trim().toLowerCase();
  const pass     = document.getElementById('authPass').value;

  hideMsg();

  // — Basic validation
  if (!email || !pass) {
    showMsg('تکایە ئیمەیل و پاسۆرد پڕ بکەرەوە', 'err');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg('ئیمەیلەکە دروست نییە', 'err');
    return;
  }
  if (pass.length < 6) {
    showMsg('پاسۆرد دەبێت کەمترین ٦ پیت بێت', 'err');
    return;
  }

  // ═══ LOGIN ═══════════════════════════════════
  if (aMode === 'login') {
    setBtnLoading(true, 'چوونەژوورەوە...');
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      // Successful login → redirect to app
      window.location.href = 'app.html';
    } catch (e) {
      const msg = e.message?.includes('Invalid login credentials')
        ? 'ئیمەیل یان پاسۆرد هەڵەیە'
        : 'هەڵەیەک ڕووی دا: ' + e.message;
      showMsg(msg, 'err');
      setBtnLoading(false);
    }
    return;
  }

  // ═══ SIGNUP ══════════════════════════════════
  const full_name = (document.getElementById('authName').value.trim() || email.split('@')[0]);

  setBtnLoading(true, 'تۆمارکردن...');

  try {
    // 1. Generate OTP
    const otp_code = generateOTP();

    // 2. Insert into users table (no supabase.auth)
    const { error: insertError } = await sb.from('users').insert([{
      email,
      full_name,
      otp_code,
      created_at: new Date()
    }]);

    if (insertError) {
      // Friendly Kurdish errors
      if (insertError.code === '23505' || insertError.message?.includes('duplicate') || insertError.message?.includes('unique')) {
        showMsg('ئەم ئیمەیلە پێشتر تۆمارکراوە — تکایە بچۆ ژوورەوە', 'err');
      } else if (insertError.code === '42501' || insertError.message?.includes('RLS') || insertError.message?.includes('policy') || insertError.message?.includes('permission')) {
        showMsg('هەڵەی مۆریەت (RLS) — تکایە ئەدمین پەیوەند بکات', 'err');
      } else if (!navigator.onLine || insertError.message?.includes('network') || insertError.message?.includes('fetch')) {
        showMsg('ئینتەرنێت پچڕاوە — تکایە دووبارە هەوڵ بدەرەوە', 'err');
      } else {
        showMsg('هەڵە: ' + insertError.message, 'err');
      }
      setBtnLoading(false);
      return;
    }

    // 3. Success → redirect to verify page
    const verifyUrl = 'verify.html?email=' + encodeURIComponent(email);
    setLoading(true, 'ئامادەکردن...');
    setTimeout(() => {
      window.location.href = verifyUrl;
    }, 600);

  } catch (e) {
    setLoading(false);
    const msg = !navigator.onLine
      ? 'ئینتەرنێت پچڕاوە — تکایە دووبارە هەوڵ بدەرەوە'
      : 'هەڵەیەک ڕووی دا — تکایە دووبارە هەوڵ بدەرەوە';
    showMsg(msg, 'err');
    setBtnLoading(false);
  }
}

// ═══════════════════════════════════════════════
//  CAPTURE REF CODE
// ═══════════════════════════════════════════════
(function captureRef() {
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  if (ref) {
    localStorage.setItem('proxo_ref', ref);
    // Clean URL
    history.replaceState({}, '', window.location.pathname);
  }
})();

// ═══════════════════════════════════════════════
//  AUTO-REDIRECT IF ALREADY LOGGED IN
// ═══════════════════════════════════════════════
(async function checkSession() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      window.location.href = 'app.html';
    }
  } catch (e) {
    // بێدەنگ
  }
})();
</script>
</body>
</html>
